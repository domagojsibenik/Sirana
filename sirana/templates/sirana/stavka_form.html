{% extends "sirana/base.html" %}

{% block content %}
<div class="card">
    <div class="card-body">
        <h2>{{ title }}</h2>

        <p><strong>Narudžba:</strong> {{ narudzba.id }}</p>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-success">Spremi</button>
            <a href="{% url 'narudzba_detail' narudzba.id %}" class="btn btn-secondary">Natrag</a>
        </form>
    </div>
</div>
{% endblock %}
